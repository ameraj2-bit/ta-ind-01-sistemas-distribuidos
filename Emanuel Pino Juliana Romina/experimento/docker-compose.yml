name: redis-cluster-experimento

services:
  redis-1:
    image: redis:7.4
    command:
      - redis-server
      - --appendonly
      - "yes"
      - --cluster-enabled
      - "yes"
      - --cluster-config-file
      - nodes.conf
      - --cluster-node-timeout
      - "5000"
      - --cluster-announce-hostname
      - redis-1
      - --cluster-preferred-endpoint-type
      - hostname
      - --cluster-announce-port
      - "6379"
      - --cluster-announce-bus-port
      - "16379"
    volumes:
      - redis-1-data:/data
    networks:
      - redis-cluster

