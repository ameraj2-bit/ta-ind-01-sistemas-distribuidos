# Clúster HDFS para el experimento de TA-IND-01:
# 1 NameNode y 4 DataNodes (con 4 DataNodes, si cae uno, HDFS puede volver a tener 3 copias).
services:
  namenode:
    image: apache/hadoop:3
    container_name: namenode
    hostname: namenode
    command: ["hdfs", "namenode"]
    ports:
      - "9870:9870"
    env_file:
      - ./config
    environment:
      ENSURE_NAMENODE_DIR: "/tmp/hadoop-root/dfs/name"

  datanode1:
    image: apache/hadoop:3
    container_name: datanode1
    hostname: datanode1
    command: ["hdfs", "datanode"]
    env_file:
      - ./config
    depends_on:
      - namenode

  datanode2:
    image: apache/hadoop:3
    container_name: datanode2
    hostname: datanode2
    command: ["hdfs", "datanode"]
    env_file:
      - ./config
    depends_on:
      - namenode

  datanode3:
    image: apache/hadoop:3
    container_name: datanode3
    hostname: datanode3
    command: ["hdfs", "datanode"]
    env_file:
      - ./config
    depends_on:
      - namenode

  datanode4:
    image: apache/hadoop:3
    container_name: datanode4
    hostname: datanode4
    command: ["hdfs", "datanode"]
    env_file:
      - ./config
    depends_on:
      - namenode
